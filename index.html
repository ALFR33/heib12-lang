<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المركز الإسلامي - القرآن الكريم مكتوب ومسموع</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Amiri & Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; }
    .font-quran { font-family: 'Amiri', serif; }
  </style>
</head>
<body class="bg-emerald-950 text-emerald-50 selection:bg-amber-500 selection:text-emerald-950 min-h-screen">
  <div id="root"></div> <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // قائمة القراء
    const RECITERS = [
      { id: 'mishary', name: 'مشارى راشد العفاسي', server: 'https://server8.mp3quran.net/afs/' },
      { id: 'maher', name: 'ماهر المعيقلي', server: 'https://server12.mp3quran.net/maher/' },
      { id: 'dosari', name: 'ياسر الدوسري', server: 'https://server11.mp3quran.net/yasser/' },
      { id: 'abdulbasit', name: 'عبد الباسط عبد الصمد', server: 'https://server7.mp3quran.net/basit/' },
      { id: 'ghamdi', name: 'سعد الغامدي', server: 'https://server7.mp3quran.net/s_gmd/' },
      { id: 'ajmi', name: 'أحمد بن علي العجمي', server: 'https://server10.mp3quran.net/ajm/' },
      { id: 'minshawi', name: 'محمد صديق المنشاوي', server: 'https://server10.mp3quran.net/minsh/' },
      { id: 'husary', name: 'محمود خليل الحصري', server: 'https://server13.mp3quran.net/hssrs/' },
      { id: 'sudais', name: 'عبد الرحمن السديس', server: 'https://server11.mp3quran.net/sds/' }
    ];

    // قائمة اللغات
    const LANGUAGES = [
      { code: 'ar', name: 'العربية' },
      { code: 'en', name: 'English' },
      { code: 'fr', name: 'Français' },
      { code: 'es', name: 'Español' },
      { code: 'ur', name: 'اردو' },
      { code: 'id', name: 'Bahasa Indonesia' },
      { code: 'tr', name: 'Türkçe' },
      { code: 'de', name: 'Deutsch' },
      { code: 'ru', name: 'Русский' }
    ];

    function App() {
      const [surahs, setSurahs] = useState([]);
      const [search, setSearch] = useState('');
      const [selectedReciter, setSelectedReciter] = useState(RECITERS[0]);
      const [selectedLang, setSelectedLanguage] = useState(LANGUAGES[0]);
      const [currentSurah, setCurrentSurah] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [viewSurah, setViewSurah] = useState(null);
      const [verses, setVerses] = useState([]);
      const [loadingVerses, setLoadingVerses] = useState(false);
      
      const audioRef = useRef(null);

      useEffect(() => {
        fetch('https://api.alquran.cloud/v1/surah')
          .then(res => res.json())
          .then(data => {
            if (data.data) {
              setSurahs(data.data.map(s => ({
                number: s.number,
                name: s.name.replace('سُورَةُ ', ''),
                type: s.revelationType === 'Meccan' ? 'مكية' : 'مدنية'
              })));
            }
          });
      }, []);

      const playAudio = (surah) => {
        if (currentSurah?.number === surah.number && isPlaying) {
          audioRef.current?.pause();
          setIsPlaying(false);
          return;
        }

        setCurrentSurah(surah);
        setIsPlaying(true);
        const numStr = surah.number.toString().padStart(3, '0');
        const url = `${selectedReciter.server}${numStr}.mp3`;

        if (!audioRef.current) {
          audioRef.current = new Audio(url);
        } else {
          audioRef.current.src = url;
        }
        audioRef.current.play();
        audioRef.current.onended = () => setIsPlaying(false);
      };

      const openSurahReader = (surah) => {
        setViewSurah(surah);
        setLoadingVerses(true);
        fetch(`https://api.alquran.cloud/v1/surah/${surah.number}`)
          .then(res => res.json())
          .then(data => {
            if (data.data) setVerses(data.data.ayahs.map(a => a.text));
            setLoadingVerses(false);
          });
      };

      const downloadSurahText = (surah) => {
        fetch(`https://api.alquran.cloud/v1/surah/${surah.number}`)
          .then(res => res.json())
          .then(data => {
            if (data.data) {
              let txt = `سورة ${surah.name}\n\n`;
              data.data.ayahs.forEach(a => txt += `${a.text} (${a.numberInSurah}) `);
              const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = `سورة_${surah.name}.txt`;
              a.click();
            }
          });
      };

      const downloadFullQuran = () => {
        fetch('https://api.alquran.cloud/v1/quran/quran-uthmani')
          .then(res => res.json())
          .then(data => {
            if (data.data) {
              let full = "القرآن الكريم كاملاً بالرسم العثماني\n\n";
              data.data.surahs.forEach(s => {
                full += `=== سورة ${s.name} ===\n`;
                s.ayahs.forEach(a => full += `${a.text} (${a.numberInSurah}) `);
                full += "\n\n";
              });
              const blob = new Blob([full], { type: 'text/plain;charset=utf-8' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = "القرآن_الكريم_كاملاً.txt";
              a.click();
            }
          });
      };

      const filtered = surahs.filter(s => s.name.includes(search) || s.number.toString() === search);

      return (
        <div className="pb-24">
          <header className="bg-emerald-900 border-b border-emerald-800 p-6">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div>
                <h1 className="text-3xl font-bold font-quran text-amber-300">المركز الإسلامي - القرآن الكريم</h1>
                <p className="text-xs text-emerald-300 mt-1">المكتبة الصوتية والنصية المعتمدة</p>
              </div>

              <div className="flex items-center gap-2 bg-emerald-950 px-4 py-2 rounded-full border border-amber-500/40 text-amber-300 text-xs font-bold">
                <span>🛡️ موقع صحيح</span>
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              </div>
            </div>

            <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6">
              <input
                type="text"
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="ابحث عن اسم السورة..."
                className="p-3 bg-emerald-950 border border-emerald-700 rounded-xl text-amber-100 placeholder-emerald-400 text-sm"
              />

              <select
                onChange={e => setSelectedReciter(RECITERS.find(r => r.id === e.target.value))}
                className="p-3 bg-emerald-950 border border-emerald-700 rounded-xl text-amber-100 text-sm"
              >
                {RECITERS.map(r => <option key={r.id} value={r.id}>القارئ: {r.name}</option>)}
              </select>

              <select
                onChange={e => setSelectedLanguage(LANGUAGES.find(l => l.code === e.target.value))}
                className="p-3 bg-emerald-950 border border-emerald-700 rounded-xl text-amber-100 text-sm"
              >
                {LANGUAGES.map(l => <option key={l.code} value={l.code}>اللغة: {l.name}</option>)}
              </select>
            </div>
          </header>

          <main className="max-w-7xl mx-auto p-6">
            <div className="bg-emerald-900/90 border border-amber-500/50 rounded-2xl p-6 mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
              <div>
                <h2 className="text-xl font-bold font-quran text-amber-200">تحميل القرآن الكريم كاملاً مكتوب ومسموع</h2>
                <p className="text-xs text-emerald-300 mt-1">تحميل فوري مباشر لجميع سور القرآن الكريم الـ 114 بالرسم العثماني.</p>
              </div>

              <button
                onClick={downloadFullQuran}
                className="px-6 py-3 bg-amber-500 text-emerald-950 font-bold rounded-xl text-sm shadow-lg hover:bg-amber-400 transition-all"
              >
                📥 تحميل النص القرآني كاملاً (ملف TXT)
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
              {filtered.map(surah => {
                const numStr = surah.number.toString().padStart(3, '0');
                const audioUrl = `${selectedReciter.server}${numStr}.mp3`;
                return (
                  <div key={surah.number} className="bg-emerald-900/40 border border-emerald-800 rounded-2xl p-5 flex flex-col justify-between hover:border-amber-500/50 transition-all">
                    <div>
                      <div className="flex justify-between items-center mb-2">
                        <span className="w-8 h-8 rounded-lg bg-emerald-950 text-amber-300 font-bold flex items-center justify-center text-xs">{surah.number}</span>
                        <span className="text-xs text-amber-300/80">{surah.type}</span>
                      </div>
                      <h3 className="text-2xl font-bold font-quran text-amber-100">سورة {surah.name}</h3>
                      <p className="text-xs text-emerald-400 mt-1">عدد آياتها: {surah.count} آية</p>
                    </div>

                    <div className="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-emerald-800/40">
                      <button onClick={() => openSurahReader(surah)} className="py-2 bg-emerald-800 text-emerald-200 rounded-lg text-xs font-bold">📖 قراءة</button>
                      <button onClick={() => playAudio(surah)} className="py-2 bg-amber-500 text-emerald-950 rounded-lg text-xs font-bold">
                        {currentSurah?.number === surah.number && isPlaying ? '⏸️ إيقاف' : '🔊 اسمع'}
                      </button>
                      <button onClick={() => downloadSurahText(surah)} className="py-1.5 bg-emerald-950 text-emerald-300 rounded-lg text-xs">📄 تحميل النص</button>
                      <a href={audioUrl} target="_blank" download className="py-1.5 bg-emerald-950 text-emerald-300 rounded-lg text-xs text-center">📥 تحميل الصوت</a>
                    </div>
                  </div>
                );
              })}
            </div>
          </main>

          {viewSurah && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-emerald-950 border border-amber-500/40 w-full max-w-3xl rounded-2xl p-6 max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4 border-b border-emerald-800 pb-3">
                  <h2 className="text-2xl font-bold font-quran text-amber-300">سورة {viewSurah.name}</h2>
                  <button onClick={() => setViewSurah(null)} className="text-amber-300 text-xl font-bold">✕</button>
                </div>

                {loadingVerses ? (
                  <p className="text-center py-12 text-amber-300">جاري تحميل الآيات الشريفة...</p>
                ) : (
                  <div className="space-y-4 text-center font-quran">
                    {verses.map((v, i) => (
                      <p key={i} className="text-2xl text-amber-100 leading-loose border-b border-emerald-900 pb-2">
                        {v} <span className="text-amber-400 text-sm font-sans">({i + 1})</span>
                      </p>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {currentSurah && (
            <div className="fixed bottom-0 left-0 right-0 bg-emerald-950 border-t border-amber-500/40 p-4 flex justify-between items-center z-40">
              <div>
                <h4 className="font-bold text-amber-200 font-quran text-lg">سورة {currentSurah.name}</h4>
                <p className="text-xs text-emerald-300">القارئ: {selectedReciter.name}</p>
              </div>
              <button onClick={() => playAudio(currentSurah)} className="px-6 py-2 bg-amber-500 text-emerald-950 font-bold rounded-xl">
                {isPlaying ? 'إيقاف' : 'تشغيل'}
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
